services:
  db:
    image: postgres:16-alpine
    container_name: soc-iris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc_strong_db_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-soc_iris_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc_admin} -d ${POSTGRES_DB:-soc_iris_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soc_internal

  app:
    build: .
    container_name: soc-iris-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-soc_admin}:${POSTGRES_PASSWORD:-soc_strong_db_pass_2026}@db:5432/${POSTGRES_DB:-soc_iris_platform}
      - APP_SECRET_KEY=${APP_SECRET_KEY:-soc-iris-abuse-sync-v3-default-signing-key-change-in-prod}
      - APP_MASTER_KEY=${APP_MASTER_KEY:-soc-iris-abuse-sync-v3-master-encryption-key-32bytes!}
      - IRIS_URL=${IRIS_URL:-https://iris.tokyo-03.com}
      - IRIS_API_KEY=${IRIS_API_KEY}
      - VERIFY_SSL=${VERIFY_SSL:-False}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - BOOTSTRAP_ADMIN_USER=${BOOTSTRAP_ADMIN_USER:-admin}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-NeuboxSOC2026!}
    volumes:
      - ./storage:/app/storage
      - ./incoming:/app/incoming
      - ./processed:/app/processed
      - ./scratch:/app/scratch
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - soc_internal

  worker:
    build: .
    container_name: soc-iris-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    command: ["python", "-m", "app.workers.job_runner"]
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-soc_admin}:${POSTGRES_PASSWORD:-soc_strong_db_pass_2026}@db:5432/${POSTGRES_DB:-soc_iris_platform}
      - APP_SECRET_KEY=${APP_SECRET_KEY:-soc-iris-abuse-sync-v3-default-signing-key-change-in-prod}
      - APP_MASTER_KEY=${APP_MASTER_KEY:-soc-iris-abuse-sync-v3-master-encryption-key-32bytes!}
      - IRIS_URL=${IRIS_URL:-https://iris.tokyo-03.com}
      - IRIS_API_KEY=${IRIS_API_KEY}
      - VERIFY_SSL=${VERIFY_SSL:-False}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - ./storage:/app/storage
      - ./incoming:/app/incoming
      - ./processed:/app/processed
      - ./scratch:/app/scratch
    networks:
      - soc_internal

volumes:
  postgres_data:

networks:
  soc_internal:
    driver: bridge
